name: Publish SAN PEDRO OFERTAS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: san-pedro-ofertas-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html admin.html app.js styles.css firebase-config.js manifest.webmanifest sw.js www/
          cp -R assets www/assets
      - name: Create Android project
        run: npx cap add android
      - name: Configure Firebase Android and Google services
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          text = root.read_text()
          marker = "dependencies {"
          if "com.google.gms:google-services" not in text:
              text = text.replace(marker, marker + "\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
          root.write_text(text)
          app = Path("android/app/build.gradle")
          text = app.read_text()
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(text)
          variables = Path("android/variables.gradle")
          if variables.exists():
              text = variables.read_text()
              if "rgcfaIncludeGoogle" not in text:
                  text = text.replace("ext {", "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
              variables.write_text(text)
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: san-pedro-ofertas-apk-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
